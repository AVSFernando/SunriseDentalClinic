<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunrise Dental Clinic - Login</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        width: 380px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .login-container h1 {
        text-align: center;
        margin-bottom: 8px;
        color: #1e3a5f;
    }

    .login-container p {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #1e88e5;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #1e88e5;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1565c0;
    }

    .error {
        background: #ffe0e0;
        color: #c62828;
        padding: 10px;
        border-radius: 7px;
        margin-bottom: 15px;
        text-align: center;
    }

    .logout {
        background: #e0f2f1;
        color: #00695c;
        padding: 10px;
        border-radius: 7px;
        margin-bottom: 15px;
        text-align: center;
    }
  </style>
</head>

<body>

<div class="login-container">

  <h1>Sunrise Dental Clinic</h1>
  <p>Admin Login</p>

  <div th:if="${param.error}" class="error">
    Invalid username or password
  </div>

  <div th:if="${param.logout}" class="logout">
    You have been logged out successfully.
  </div>

  <form th:action="@{/login}" method="post">

    <div class="form-group">
      <label>Username</label>
      <input
              type="text"
              name="username"
              placeholder="Enter username"
              required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
              type="password"
              name="password"
              placeholder="Enter password"
              required>
    </div>

    <button type="submit">
      Sign In
    </button>

  </form>

</div>

</body>
</html>
